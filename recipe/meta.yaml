{% set name = "windmapper" %}
{% set version = "2.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/windmapper-{{ version }}.tar.gz
  sha256: f8e795033e3c379784ac0a5fcfa306f7076c0de15775e206bafe29886a8b6aa6

build:
  entry_points:
    - windmapper = windmapper:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  skip: true  # [win]

requirements:
  host:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - make
    - python
    - scikit-build-core
    - pip
    - cmake >=3.16
  run:
    - python
    - numpy
    - scipy
    - elevation
    - pyproj
    - tqdm
    - rasterio
    - cloudpickle
    - gdal
    - mpi4py
    - windninja >= 3.13.0

test:
  imports:
    - windmapper
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  summary: Windfield library generation
  home: https://github.com/Chrismarsh/Windmapper/
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Chrismarsh
